<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a11" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="pulseGlow1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="pulseGlow2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6"/>
      <circle cx="40" cy="40" r="1.5" fill="#38bdf8" opacity="0.3"/>
    </pattern>

    <style>
      @keyframes floatParticle {
        0%, 100% { transform: translateY(0px) scale(1); opacity: 0.3; }
        50% { transform: translateY(-20px) scale(1.15); opacity: 0.7; }
      }
      @keyframes pulseRing {
        0% { r: 60px; opacity: 0.5; }
        50% { r: 90px; opacity: 0.15; }
        100% { r: 60px; opacity: 0.5; }
      }
      @keyframes flowDash {
        to { stroke-dashoffset: -40; }
      }
      @keyframes nodeGlow {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.9; }
      }
      .particle1 { animation: floatParticle 6s ease-in-out infinite; }
      .particle2 { animation: floatParticle 8s ease-in-out infinite 2s; }
      .particle3 { animation: floatParticle 7s ease-in-out infinite 4s; }
      .ring-anim { animation: pulseRing 5s ease-in-out infinite; }
      .pipe-flow { stroke-dasharray: 8, 8; animation: flowDash 2s linear infinite; }
      .dot-glow { animation: nodeGlow 3s ease-in-out infinite; }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -1px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 400;
        letter-spacing: 0.2px;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 13px;
        font-weight: 600;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16" />
  <rect width="1200" height="420" fill="url(#techGrid)" rx="16" />

  <!-- Dynamic Glowing Orbs in Background -->
  <circle class="ring-anim" cx="150" cy="120" r="70" fill="url(#pulseGlow1)" />
  <circle class="ring-anim" cx="1060" cy="300" r="85" fill="url(#pulseGlow2)" />
  <circle class="particle1" cx="220" cy="340" r="6" fill="#38bdf8" />
  <circle class="particle2" cx="980" cy="90" r="8" fill="#a855f7" />
  <circle class="particle3" cx="600" cy="60" r="5" fill="#818cf8" />

  <!-- Animated Pipeline Circuit Flow Lines in Background -->
  <g opacity="0.6">
    <path class="pipe-flow" d="M 80 340 L 320 340 L 400 370 L 800 370 L 880 340 L 1120 340" fill="none" stroke="#6366f1" stroke-width="2" />
    <circle cx="80" cy="340" r="4" fill="#38bdf8" class="dot-glow" />
    <circle cx="400" cy="370" r="4" fill="#818cf8" class="dot-glow" />
    <circle cx="800" cy="370" r="4" fill="#c084fc" class="dot-glow" />
    <circle cx="1120" cy="340" r="4" fill="#38bdf8" class="dot-glow" />
  </g>

  <!-- Foreground Content: Header & Badges -->
  <!-- Top Category Badge Pill -->
  <g transform="translate(480, 50)">
    <rect x="0" y="0" width="240" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" />
    <circle cx="18" cy="16" r="4" fill="#22c55e" />
    <text x="32" y="21" fill="#e0e7ff" class="pill-text">🚀 API RELEASE ECOSYSTEM</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="150" text-anchor="middle" class="title-text" fill="url(#primaryGrad)" font-size="46">
    Awesome API Version &amp; Release Publishing
  </text>

  <!-- Subtitle -->
  <text x="600" y="200" text-anchor="middle" class="subtitle-text" fill="#94a3b8" font-size="19">
    Curated Platforms, Version Automation, GitOps Continuous Delivery &amp; Artifact Registries
  </text>

  <!-- Key Pillars / Feature Pills in Foreground -->
  <g transform="translate(180, 240)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="180" height="44" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="90" y="27" text-anchor="middle" fill="#38bdf8" class="pill-text">⚡ Semantic Versioning</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(220, 0)">
      <rect width="180" height="44" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="90" y="27" text-anchor="middle" fill="#818cf8" class="pill-text">📦 Artifact Registries</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(440, 0)">
      <rect width="180" height="44" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="90" y="27" text-anchor="middle" fill="#c084fc" class="pill-text">🔄 GitOps Continuous Delivery</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(660, 0)">
      <rect width="180" height="44" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="90" y="27" text-anchor="middle" fill="#34d399" class="pill-text">🚩 Feature Flag Releases</text>
    </g>
  </g>
</svg>
